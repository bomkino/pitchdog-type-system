name: Publish v13.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_publish-release.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'bomkino/pitchdog-type-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify final repository tree
        shell: bash
        run: |
          rm -f .github/workflows/_publish-release.yml
          python3 scripts/verify_repository.py
      - name: Restore the verified tree on main
        id: final
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time release publisher"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build complete font handoff asset
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("pitchdog-font-handoff-v13")
          output = Path("pitchdog-font-handoff-v13.zip")
          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  archive.write(path, Path("pitchdog-font-handoff-v13") / path.relative_to(root))
      - name: Publish immutable v13.0.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        run: |
          ASSET_SHA="$(sha256sum pitchdog-font-handoff-v13.zip | cut -d' ' -f1)"
          {
            echo "Private v13 source of truth for pitch.dog typography."
            echo
            echo "- 7 governed runtime WOFF2 faces"
            echo "- Complete 138-font handoff for web, native, and design tools"
            echo "- CSS, design tokens, and UI/social/YouTube typography roles"
            echo "- Fonts dedicated under CC0-1.0; non-font material governed by LICENSE.md"
            echo "- Verified: 493/493 repository checks, 237/237 type-system checks, 145/145 font binaries parsed"
            echo "- Handoff ZIP SHA-256: \`$ASSET_SHA\`"
            echo
            echo 'Install:'
            echo
            echo '    npm install "git+ssh://git@github.com/bomkino/pitchdog-type-system.git#v13.0.0"'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create v13.0.0 pitchdog-font-handoff-v13.zip \
            --target "$FINAL_SHA" \
            --title "v13.0.0 — pitch.dog typography system" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
