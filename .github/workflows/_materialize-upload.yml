name: Materialize pitch.dog release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify governed files
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath

          manifest = json.loads(Path(".pitchdog-upload/manifest.json").read_text(encoding="utf-8"))
          for record in manifest["files"]:
              relative = PurePosixPath(record["path"])
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(f"Unsafe path: {relative}")
              target = Path(*relative.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              digest = hashlib.sha256()
              written = 0
              with target.open("wb") as output:
                  for part_name in record["parts"]:
                      part = Path(part_name).read_bytes()
                      output.write(part)
                      digest.update(part)
                      written += len(part)
              if written != record["size"]:
                  raise SystemExit(f"Size mismatch: {relative}")
              if digest.hexdigest() != record["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch: {relative}")
              os.chmod(target, 0o755 if record["mode"] == "100755" else 0o644)
      - name: Commit the complete v13 release
        shell: bash
        run: |
          rm -rf .pitchdog-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to materialize"; exit 1; }
          git commit -m "Release pitch.dog type system v13.0.0"
          git push origin HEAD:main
